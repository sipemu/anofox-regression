name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: [stable, beta, nightly]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --all-features
      - name: Run library tests without features
        if: matrix.rust == 'stable'
        run: cargo test --lib --no-default-features

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build docs
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    name: MSRV (1.87)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.87"
      - uses: Swatinem/rust-cache@v2
      - name: Check the library (no features)
        run: cargo check --lib -p anofox-regression --no-default-features
      - name: Check the library (all features)
        run: cargo check --lib -p anofox-regression --all-features

  # The DuckDB extension (anofox-statistics) builds this crate with Rust 1.86:
  # DuckDB's wasm CI pins an emsdk that rejects objects from Rust >= 1.87. The
  # declared MSRV stays 1.87 (basin), so this job ignores it; it catches uses
  # of 1.87 library features such as `is_multiple_of`.
  duckdb-toolchain:
    name: DuckDB toolchain (Rust 1.86)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.86"
      - uses: Swatinem/rust-cache@v2
      - name: Check the library (no features)
        run: cargo check --lib -p anofox-regression --no-default-features --ignore-rust-version
      - name: Check the library (all features)
        run: cargo check --lib -p anofox-regression --all-features --ignore-rust-version

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the packaged crate
        run: cargo package -p anofox-regression

  deny:
    name: Dependencies (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  semver:
    name: Semver (report)
    runs-on: ubuntu-latest
    # Reports API changes against the latest release (see the step log). Not
    # blocking before 1.0: the 0.8 cleanup (#177-#180) is breaking by design;
    # drop `continue-on-error` once 1.0 is out.
    steps:
      - uses: actions/checkout@v4
      - uses: obi1kenobi/cargo-semver-checks-action@v2
        continue-on-error: true
        with:
          package: anofox-regression

  wasm-test:
    name: WASM/JS Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Build WASM package
        run: wasm-pack build crates/anofox-regression-js --target web --out-dir pkg
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install npm dependencies
        working-directory: js
        run: npm ci
      - name: Run npm tests
        working-directory: js
        run: npm test

  js-parity:
    name: JS/WASM parity
    runs-on: ubuntu-latest
    # Every public Rust item needs a JS binding or an allow-list entry with a
    # reason (js/parity-allowlist.txt, scripts/js_parity.py; #287). The
    # nightly is pinned because the rustdoc JSON format changes between
    # nightlies.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-03-10
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Rust public API (rustdoc JSON)
        run: cargo rustdoc --lib -- -Z unstable-options --output-format json
      - name: Build WASM package
        run: wasm-pack build crates/anofox-regression-js --target web --out-dir pkg --dev
      - name: Check parity
        run: python3 scripts/js_parity.py

  skill:
    name: Statistician skill
    runs-on: ubuntu-latest
    # skills/anofox-regression-statistician documents the crate for agents.
    # Every API name it uses must exist, its reference must name the current
    # crate version, and its analysis template must build and run against
    # this commit (scripts/skill_api_check.py, skills/README.md).
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-03-10
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            skills/anofox-regression-statistician/assets/analysis-template
      - name: Rust API (rustdoc JSON, public and private items)
        run: |
          cargo +nightly-2026-03-10 rustdoc --lib --all-features --target-dir target/skill-pub -- -Z unstable-options --output-format json
          cargo +nightly-2026-03-10 rustdoc --lib --all-features --target-dir target/skill -- -Z unstable-options --output-format json --document-private-items
      - name: Check the skill's API names and version
        run: python3 scripts/skill_api_check.py
      - name: Build and run the analysis template against this commit
        working-directory: skills/anofox-regression-statistician/assets/analysis-template
        env:
          RAYON_NUM_THREADS: "1"
        run: cargo +stable run --release --config 'patch.crates-io.anofox-regression.path="../../../.."'

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate coverage
        # Fails below the current line coverage (94 %); AGENTS.md targets 95 %,
        # which codecov enforces on the lines a PR adds (codecov.yml).
        run: cargo llvm-cov --all-features --lcov --output-path lcov.info --fail-under-lines 94
      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: false

  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    needs: [test, clippy, fmt, docs, msrv, duckdb-toolchain, package, deny, skill]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Publish to crates.io
        run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
