name: Validation fixtures

# Regenerate the R reference fixtures (validation/r_fixtures.txt) with the
# current R and CRAN packages and compare their values with the committed
# ones. A failure means a package update changed a reference: check the
# new values against the crate before updating the fixture.
on:
  schedule:
    - cron: "0 5 1 * *" # monthly, 1st at 05:00 UTC
  workflow_dispatch:

jobs:
  regenerate:
    name: Regenerate and compare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install R packages
        run: |
          Rscript -e 'install.packages(c("broom", "car", "greybox", "grpreg", "Hmisc",
            "lavaan", "lme4", "lmtest", "MASS", "mediation", "mice", "multcomp", "nlme", "numDeriv",
            "quantreg", "rms", "sandwich", "statmod", "survival"))'
      - name: Regenerate fixtures
        run: OUT_DIR="$RUNNER_TEMP/fixtures" validation/regenerate_r_fixtures.sh
      - name: Compare with the committed fixtures
        run: python3 validation/compare_fixtures.py "$RUNNER_TEMP/fixtures"
      - name: Record versions
        if: always()
        run: Rscript validation/record_r_versions.R | tee "$RUNNER_TEMP/R_VERSIONS.md"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regenerated-fixtures
          path: ${{ runner.temp }}
