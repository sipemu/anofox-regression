# cargo-deny configuration (CI job `deny`): advisories, licences, bans and
# sources of the dependency graph.

[graph]
all-features = true

[advisories]
# RustSec advisories are errors; unmaintained crates only in our direct
# dependencies.
unmaintained = "workspace"
yanked = "deny"

[licenses]
# Permissive licences only (the crate is MIT).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
# Several versions of a crate (rand, getrandom, thiserror via dependencies)
# are reported, not denied.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
