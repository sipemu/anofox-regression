[workspace]
members = [".", "crates/anofox-regression-js"]
resolver = "2"

# Profiles are read from the workspace root only (the WASM build uses this).
[profile.release]
opt-level = 3
lto = true

[package]
name = "anofox-regression"
version = "0.7.0"
edition = "2021"
# basin 3.1 requires 1.87; checked in CI (msrv job).
rust-version = "1.87"
description = "A robust statistics library for regression analysis"
license = "MIT"
authors = ["Simon M"]
repository = "https://github.com/sipemu/anofox-regression"
readme = "README.md"
keywords = ["statistics", "regression", "linear-regression", "inference"]
categories = ["science", "algorithms"]
documentation = "https://docs.rs/anofox-regression"
# Ship the library only: tests, fixtures, R scripts, the JS package and CI
# configuration stay in the repository.
include = [
    "/src/**/*",
    "/examples/**/*",
    "/benches/**/*",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/THIRD_PARTY_NOTICES.md",
    "/STABILITY.md",
    "/SECURITY.md",
]

[package.metadata.docs.rs]
all-features = true

[dependencies]
faer = { version = "0.23", default-features = false, features = ["std", "linalg"] }
statrs = "0.18"
thiserror = "2.0"
basin = { version = "3.1", default-features = false }
rayon = { version = "1.10", optional = true }

[features]
# Fit resamples in parallel (validation::predab_resample_par, bootcov_par).
parallel = ["dep:rayon"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }

[dev-dependencies]
approx = "0.5"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "aid_benchmark"
harness = false

[lints.clippy]
# Reference values from R / scikit-learn are printed with 17 significant
# digits (`%.17g`) so they round-trip exactly; truncating them would change
# the references.
excessive_precision = "allow"
