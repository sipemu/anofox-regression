[workspace]
members = [".", "crates/anofox-regression-js"]
resolver = "2"

[package]
name = "anofox-regression"
version = "0.7.0"
edition = "2021"
description = "A robust statistics library for regression analysis"
license = "MIT"
authors = ["Simon M"]
repository = "https://github.com/sipemu/anofox-regression"
readme = "README.md"
keywords = ["statistics", "regression", "linear-regression", "inference"]
categories = ["science", "algorithms"]
documentation = "https://docs.rs/anofox-regression"

[dependencies]
faer = { version = "0.23", default-features = false, features = ["std", "linalg"] }
statrs = "0.18"
thiserror = "2.0"
basin = { version = "3.1", default-features = false }
rayon = { version = "1.10", optional = true }

[features]
# Fit resamples in parallel (validation::predab_resample_par, bootcov_par).
parallel = ["dep:rayon"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }

[dev-dependencies]
approx = "0.5"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "aid_benchmark"
harness = false
